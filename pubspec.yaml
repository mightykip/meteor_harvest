name: meteor_harvest
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  shaders:
    - assets/shaders/nebula.frag
    - assets/shaders/crystal_shimmer.frag
    - assets/shaders/warp_stars.frag
    - assets/shaders/shockwave.frag

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
